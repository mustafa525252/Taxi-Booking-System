
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | TaxiBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f7f6f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.07);
        }

        .brand {
            color: #b58b45;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .reset-btn {
            background: #b58b45;
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
        }

        .reset-btn:hover {
            background: #967039;
            color: white;
        }

        .form-control {
            padding: 12px;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <div class="text-center mb-4">
        <h2 class="brand">TAXIBOOK</h2>
        <h4 class="mt-3">Forgot Password?</h4>

        <p class="text-muted">
            Enter your registered driver email address.
            We'll send you a verification OTP.
        </p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'driver_forgot_password' %}">
        {% csrf_token %}

        <div class="mb-4">
            <label class="form-label">Email Address</label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter registered email"
                required
            >
        </div>

        <button type="submit" class="btn reset-btn w-100">
            Send Verification OTP
        </button>

    </form>

    <div class="text-center mt-4">
        <a href="{% url 'driver_login' %}" class="text-decoration-none">
            Back to Driver Login
        </a>
    </div>

</div>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Login | TaxiBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f7f6f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }

        .brand {
            color: #b58b45;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .login-btn {
            background: #b58b45;
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #967039;
            color: white;
        }

        .form-control {
            padding: 12px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">
        <h2 class="brand">TAXIBOOK</h2>
        <h4 class="mt-3">Driver Login</h4>
        <p class="text-muted">Sign in to manage your driver account.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'driver_login' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your registered email"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input
                type="password"
                name="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >
        </div>

        <div class="form-check mb-4">
            <input
                type="checkbox"
                name="remember"
                class="form-check-input"
                id="remember"
            >
            <label class="form-check-label" for="remember">
                Remember me
            </label>
        </div>

        <button type="submit" class="btn login-btn w-100">
            Login as Driver
        </button>

    </form>

    <div class="text-center mt-4">
        <p class="mb-1">
            Don't have a driver account?
        </p>

        <a href="{% url 'driver_register' %}">
            Register as a Driver
        </a>
    </div>

</div>

</body>
</html>

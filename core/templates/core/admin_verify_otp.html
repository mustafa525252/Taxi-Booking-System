
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Taxi Booking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101010;
            font-family: Arial, sans-serif;
        }

        .verify-card {
            width: 100%;
            max-width: 430px;
            background: #1c1c1c;
            padding: 40px;
            border-radius: 18px;
            border: 1px solid #393327;
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
        }

        .icon-box {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #332b1c;
            color: #d6ad60;
            border-radius: 50%;
            font-size: 27px;
        }

        h2 {
            color: #f5f0e5;
            font-weight: 700;
        }

        p {
            color: #aaa;
        }

        .form-control {
            background: #292929;
            border: 1px solid #444;
            color: white;
            padding: 13px;
            text-align: center;
            font-size: 22px;
            letter-spacing: 8px;
        }

        .form-control:focus {
            background: #292929;
            color: white;
            border-color: #d6ad60;
            box-shadow: none;
        }

        .btn-gold {
            background: #d6ad60;
            color: #151515;
            border: none;
            padding: 13px;
            font-weight: 700;
        }

        .btn-gold:hover {
            background: #edc879;
        }

        .alert {
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="verify-card">

    <div class="icon-box">✉</div>

    <h2 class="text-center mb-2">Verify OTP</h2>

    <p class="text-center mb-4">
        Enter the six-digit OTP printed in your Django terminal.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
            <input
                type="text"
                name="otp"
                class="form-control"
                placeholder="000000"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >
        </div>

        <button type="submit" class="btn btn-gold w-100">
            Verify OTP
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'admin_forgot_password' %}"
           class="text-decoration-none"
           style="color:#d6ad60;">
            Request New OTP
        </a>
    </div>

</div>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Taxi Booking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --gold: #a47d36;
            --gold-light: #f7f0e2;
            --dark: #252525;
            --muted: #858585;
            --border: #eae7e0;
        }

        body {
            min-height: 100vh;
            background: #f7f7f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 12px 40px rgba(0,0,0,.045);
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 17px;
            background: var(--gold-light);
            color: var(--gold);
            font-size: 23px;
        }

        .heading {
            font-size: 25px;
            font-weight: 750;
            color: var(--dark);
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
        }

        .admin-badge {
            display: inline-block;
            background: var(--gold-light);
            color: var(--gold);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #444;
            margin-bottom: 7px;
        }

        .input-group {
            border: 1px solid #e5e2dc;
            border-radius: 9px;
            overflow: hidden;
        }

        .input-group:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(164,125,54,.10);
        }

        .input-group-text {
            background: white;
            border: none;
            color: #999;
            padding-left: 14px;
        }

        .form-control {
            border: none;
            box-shadow: none !important;
            font-size: 13px;
            padding: 12px 10px;
        }

        .password-toggle {
            background: white;
            border: none;
            color: #999;
            padding: 0 14px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            background: var(--dark);
            border: 1px solid var(--dark);
            color: white;
            border-radius: 9px;
            padding: 13px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
        }

        .login-btn:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: white;
        }

        .alert {
            font-size: 12px;
            border-radius: 9px;
        }

        .footer-text {
            color: #aaa;
            font-size: 10px;
            text-align: center;
            margin-top: 28px;
        }

        @media(max-width: 480px) {
            .login-card {
                padding: 28px 21px;
            }

            .heading {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <!-- Brand -->

    <div class="text-center mb-4">

        <div class="brand-icon">
            <i class="fa-solid fa-taxi"></i>
        </div>

        <div class="text-uppercase fw-bold mb-2"
             style="font-size:10px; letter-spacing:2px; color:#a47d36;">
            TAXI BOOKING SYSTEM
        </div>

        <span class="admin-badge">
            <i class="fa-solid fa-shield-halved me-1"></i>
            ADMIN PORTAL
        </span>

        <h2 class="heading mb-2">Welcome Back</h2>

        <p class="subtitle mb-0">
            Sign in to access your administration dashboard.
        </p>

    </div>

    <!-- Django Messages -->

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <!-- Login Form -->

    
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <!-- Admin Role -->
        <input type="hidden" name="role" value="admin">

        <!-- Username -->
        <div class="mb-3">

            <label class="form-label">Username</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-regular fa-user"></i>
                </span>

                <input
                    type="text"
                    name="identity"
                    class="form-control"
                    placeholder="Enter your admin username"
                    autocomplete="username"
                    required
                >
            </div>

        </div>

        <!-- Password -->
        <div class="mb-3">

            <label class="form-label">Password</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword()"
                    aria-label="Show or hide password"
                >
                    <i class="fa-regular fa-eye" id="passwordIcon"></i>
                </button>
            </div>

        </div>

        <!-- Remember Me and Forgot Password -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <label class="small text-muted">
                <input type="checkbox" name="remember" class="me-1">
                Remember me
            </label>

            <a href="{% url 'admin_forgot_password' %}"
            class="forgot-link">
                Forgot Password?
            </a>

        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn">
            SIGN IN
            <i class="fa-solid fa-arrow-right ms-2"></i>
        </button>

    </form>


    <div class="footer-text">
        <i class="fa-solid fa-lock me-1"></i>
        Secure Administrator Access
        <br><br>
        © 2026 Taxi Booking System. All rights reserved.
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function togglePassword() {

        const password = document.getElementById('password');
        const icon = document.getElementById('passwordIcon');

        if (password.type === 'password') {
            password.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            password.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>

</body>
</html>

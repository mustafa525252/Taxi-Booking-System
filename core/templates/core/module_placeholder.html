
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ module_title }} | TaxiBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #111315;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .placeholder-card {
            background: #1c2023;
            border: 1px solid #303438;
            border-radius: 18px;
            padding: 45px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .module-icon {
            width: 75px;
            height: 75px;
            border-radius: 18px;
            background: #30291c;
            color: #e5bd65;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 25px;
        }

        h2 {
            color: #e5bd65;
            margin-bottom: 15px;
        }

        p {
            color: #9da3a8;
            line-height: 1.7;
        }

        .btn-gold {
            background: #d6ae55;
            color: #111315;
            border: none;
            border-radius: 8px;
            padding: 11px 22px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }

        .btn-gold:hover {
            background: #e5bd65;
            color: #111315;
        }

        .coming-soon {
            color: #d6ae55;
            font-size: 12px;
            background: #30291c;
            padding: 7px 13px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

    <div class="placeholder-card">

        <div class="module-icon">
            <i class="fa-solid {{ module_icon }}"></i>
        </div>

        <span class="coming-soon">
            COMING SOON
        </span>

        <h2>{{ module_title }}</h2>

        <p>{{ module_description }}</p>

        <a href="{% url 'dashboard' %}" class="btn-gold">
            <i class="fa-solid fa-arrow-left me-2"></i>
            Back to Dashboard
        </a>

    </div>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | TaxiBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --gold: #c69b45;
            --dark: #252525;
            --muted: #777777;
            --light: #f8f7f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--light);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .forgot-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 45px 38px;
            border-radius: 18px;
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.07);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            background: #fbf5e9;
            color: var(--gold);
            border-radius: 50%;
            font-size: 25px;
        }

        .logo h2 {
            font-weight: 800;
            color: var(--dark);
            letter-spacing: 1px;
        }

        .logo h2 span {
            color: var(--gold);
        }

        .logo p {
            color: var(--muted);
            font-size: 14px;
            margin-top: 8px;
        }

        .form-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .form-title h4 {
            color: var(--dark);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .form-title p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        .input-group {
            border: 1px solid #e5e5e5;
            border-radius: 9px;
            overflow: hidden;
        }

        .input-group-text {
            background: #ffffff;
            border: none;
            color: var(--gold);
            padding-left: 15px;
        }

        .form-control {
            border: none;
            padding: 13px 12px;
            font-size: 14px;
            box-shadow: none !important;
        }

        .input-group:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(198, 155, 69, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: var(--gold);
            color: #ffffff;
            border: none;
            border-radius: 9px;
            font-weight: 700;
            margin-top: 22px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #ad8234;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--dark);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--gold);
        }

        .alert {
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .forgot-card {
                padding: 35px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-card">

        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-key"></i>
            </div>

            <h2>TAXI<span>BOOK</span></h2>
            <p>Your journey, our responsibility.</p>
        </div>

        <div class="form-title">
            <h4>Forgot Password?</h4>
            <p>
                Don't worry! Enter your registered email address.
                We'll send you a verification OTP to reset your password.
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'user_forgot_password' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="email" class="form-label">
                    Registered Email Address
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-regular fa-envelope"></i>
                    </span>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Send OTP <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>

        </form>

        <a href="{% url 'login' %}" class="back-link">
            <i class="fa-solid fa-arrow-left me-2"></i>
            Back to Login
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

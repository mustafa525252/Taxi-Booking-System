
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Taxi Booking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --gold: #a47d36;
            --gold-light: #f7f0e2;
            --dark: #252525;
            --muted: #858585;
        }

        body {
            min-height: 100vh;
            background: #f7f7f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 490px;
            background: white;
            border: 1px solid #eae7e0;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 12px 40px rgba(0,0,0,.045);
        }

        .brand-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 17px;
            border-radius: 16px;
            background: var(--gold-light);
            color: var(--gold);
            font-size: 23px;
        }

        .heading {
            font-size: 25px;
            font-weight: 750;
            color: var(--dark);
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #444;
            margin-bottom: 7px;
        }

        .input-group {
            border: 1px solid #e5e2dc;
            border-radius: 9px;
            overflow: hidden;
        }

        .input-group-text {
            background: white;
            border: none;
            color: #999;
            padding-left: 14px;
        }

        .form-control {
            border: none;
            box-shadow: none !important;
            font-size: 13px;
            padding: 12px 10px;
        }

        .input-group:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(164,125,54,.10);
        }

        .password-toggle {
            background: white;
            border: none;
            color: #999;
            padding: 0 14px;
            cursor: pointer;
        }

        .register-btn {
            width: 100%;
            background: var(--dark);
            border: 1px solid var(--dark);
            color: white;
            border-radius: 9px;
            padding: 13px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
        }

        .register-btn:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: white;
        }

        .login-link {
            color: var(--gold);
            font-weight: 700;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 12px;
            border-radius: 9px;
        }

        .footer-text {
            color: #aaa;
            font-size: 10px;
            text-align: center;
            margin-top: 24px;
        }

        @media(max-width: 480px) {
            .register-card {
                padding: 27px 21px;
            }

            .heading {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">

        <div class="brand-icon">
            <i class="fa-solid fa-taxi"></i>
        </div>

        <div class="text-uppercase fw-bold mb-2"
             style="font-size:10px; letter-spacing:2px; color:#a47d36;">
            TAXI BOOKING SYSTEM
        </div>

        <h2 class="heading mb-2">Create Your Account</h2>

        <p class="subtitle mb-0">
            Register today and get started with your journey.
        </p>

    </div>

    <!-- Django Messages -->

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <!-- Registration Form -->

    <form method="POST" action="{% url 'user_register' %}">
        {% csrf_token %}

        <!-- Full Name -->

        <div class="mb-3">
            <label class="form-label">Full Name</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-regular fa-user"></i>
                </span>

                <input type="text"
                       name="full_name"
                       class="form-control"
                       placeholder="Enter your full name"
                       maxlength="150"
                       autocomplete="name"
                       value="{{ request.POST.full_name|default:'' }}"
                       required>
            </div>
        </div>

        <!-- Email -->

        <div class="mb-3">
            <label class="form-label">Email Address</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-regular fa-envelope"></i>
                </span>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="example@email.com"
                       autocomplete="email"
                       value="{{ request.POST.email|default:'' }}"
                       required>
            </div>
        </div>

        <!-- Phone -->

        <div class="mb-3">
            <label class="form-label">Phone Number</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-phone"></i>
                </span>

                <input type="tel"
                       name="mobile"
                       class="form-control"
                       placeholder="Enter your phone number"
                       maxlength="15"
                       autocomplete="tel"
                       value="{{ request.POST.mobile|default:'' }}"
                       required>
            </div>
        </div>

        <!-- Password -->

        <div class="mb-3">
            <label class="form-label">Password</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       required>

                <button type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', 'passwordIcon')">
                    <i class="fa-regular fa-eye" id="passwordIcon"></i>
                </button>
            </div>
        </div>

        <!-- Confirm Password -->

        <div class="mb-4">
            <label class="form-label">Confirm Password</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input type="password"
                       name="confirm_password"
                       id="confirm_password"
                       class="form-control"
                       placeholder="Confirm your password"
                       autocomplete="new-password"
                       required>

                <button type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirm_password', 'confirmIcon')">
                    <i class="fa-regular fa-eye" id="confirmIcon"></i>
                </button>
            </div>
        </div>

        <!-- Submit -->

        <button type="submit" class="register-btn">
            Create Account
            <i class="fa-solid fa-arrow-right ms-2"></i>
        </button>

    </form>

    <div class="text-center mt-4">
        <span class="subtitle">Already have an account?</span>
        <a href="{% url 'login' %}" class="login-link ms-1">
            Sign In
        </a>
    </div>

    <div class="footer-text">
        © 2026 Taxi Booking System. All rights reserved.
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
